<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interactive Background Changer</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Interactive Background Changer</h1>

            <p>
                Click the button below to change the background
                color of the webpage.
            </p>

            <button type="button" id="changeColorButton">
                Change Background Color
            </button>

            <button type="button" id="resetButton">
                Reset Background
            </button>

            <p id="colorText">
                Current background: Light Blue
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
